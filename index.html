<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Твой подарок</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3eee7;
      color: #222;
      font-family: "Poiret One", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 16px 40px;
      text-align: center;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: 38px;
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.15;
    }

    .subtitle {
      margin-bottom: 30px;
      font-size: 22px;
      letter-spacing: 0.04em;
      opacity: 0.72;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
      cursor: pointer;
      transition:
        opacity 0.6s ease,
        transform 0.6s ease,
        max-height 0.6s ease;
    }

    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .card.hidden {
      opacity: 0;
      transform: scale(0.92);
      max-height: 0;
      margin: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .card.selected {
      transform: scale(1.01);
    }

    .result {
      display: none;
      padding-top: 18px;
    }

    .result.show {
      display: block;
      animation: appear 0.9s ease forwards;
    }

    .result-title {
      margin: 0 0 30px;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .info {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 22px;
      padding: 30px 22px 32px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .date {
      margin: 0 0 26px;
      font-size: 27px;
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.45;
    }

    .hint {
      margin: 0;
      font-size: 22px;
      line-height: 1.55;
      letter-spacing: 0.025em;
    }

    .secret {
      margin: 30px 0 0;
      padding-top: 24px;
      border-top: 1px solid rgba(0, 0, 0, 0.10);
      font-size: 20px;
      line-height: 1.5;
      letter-spacing: 0.025em;
      font-style: italic;
      opacity: 0.68;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 380px) {
      .container {
        padding-left: 12px;
        padding-right: 12px;
      }

      h1 {
        font-size: 34px;
      }

      .subtitle {
        font-size: 20px;
      }

      .result-title {
        font-size: 31px;
      }

      .date {
        font-size: 24px;
      }

      .hint {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="startScreen">

      <h1>Выбери свой подарок</h1>

      <div class="subtitle">
        Доверься интуиции
      </div>

      <div class="cards">

        <button class="card" onclick="chooseGift(1)">
          <img
            src="03968e67-1cba-4f3a-a979-e55ffd8fa4d3.png"
            alt="Первый вариант">
        </button>

        <button class="card" onclick="chooseGift(2)">
          <img
            src="23492d5a-0d37-47df-9001-7e77c6026348.png"
            alt="Второй вариант">
        </button>

        <button class="card" onclick="chooseGift(3)">
          <img
            src="82d72417-2606-4d25-85c1-1e5b94672d93.png"
            alt="Третий вариант">
        </button>

      </div>

    </div>


    <div id="result" class="result">

      <h2 class="result-title">
        Твой выбор сделан
      </h2>

      <div class="info">

        <p class="date" id="giftDate"></p>

        <p class="hint" id="giftHint"></p>

        <p class="secret">
          Остальное узнаешь на месте.
        </p>

      </div>

    </div>

  </div>


  <script>

    const tg = window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      if (tg.BackButton) {
        tg.BackButton.hide();
      }
    }


    function chooseGift(number) {

      const cards = document.querySelectorAll(".card");

      cards.forEach((card, index) => {

        if (index === number - 1) {
          card.classList.add("selected");
        } else {
          card.classList.add("hidden");
        }

      });


      setTimeout(function() {

        document.getElementById("startScreen").style.display = "none";


        const date = document.getElementById("giftDate");
        const hint = document.getElementById("giftHint");


        if (number === 1) {

          date.innerHTML =
            "16 / 17 / 18 сентября — выбирай день<br>11:15";

          hint.innerHTML =
            "Огонь. Аромат. Твоя маленькая алхимия.";

        }


        if (number === 2) {

          date.innerHTML =
            "17 / 24 сентября — выбирай день<br>11:00";

          hint.innerHTML =
            "То, что невозможно увидеть,<br>" +
            "но можно запомнить навсегда.";

        }


        if (number === 3) {

          date.innerHTML =
            "14 / 17 сентября — выбирай день<br>11:00";

          hint.innerHTML =
            "Иногда самые важные слова<br>" +
            "лучше оставить на память.";

        }


        document.getElementById("result").classList.add("show");


        if (tg && tg.BackButton) {

          tg.BackButton.show();

          tg.BackButton.onClick(function() {
            location.reload();
          });

        }

      }, 700);

    }

  </script>

</body>
</html>
