<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Твой подарок</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Шрифт в стиле модерн -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3eee7;
      color: #222;
      font-family: "Poiret One", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 16px;
      text-align: center;
    }

    h1 {
      font-family: "Poiret One", sans-serif;
      font-size: 38px;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin: 8px 0 5px;
    }

    .subtitle {
      font-family: "Poiret One", sans-serif;
      font-size: 22px;
      letter-spacing: 0.04em;
      opacity: 0.72;
      margin-bottom: 28px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 20px;
      overflow: hidden;
      background: white;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
      cursor: pointer;
      transition: all 0.6s ease;
    }

    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .card-title {
      padding: 12px;
      font-family: "Poiret One", sans-serif;
      font-size: 19px;
      letter-spacing: 0.05em;
    }

    .card.hidden {
      opacity: 0;
      transform: scale(0.7);
      max-height: 0;
      margin: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .card.selected {
      transform: scale(1.02);
    }

    .result {
      display: none;
    }

    .result.show {
      display: block;
      animation: appear 0.8s ease;
    }

    .result h2 {
      font-family: "Poiret One", sans-serif;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin: 15px 0 28px;
    }

    .info {
      background: white;
      border-radius: 22px;
      padding: 28px 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
    }

    .date {
      font-family: "Poiret One", sans-serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin: 0 0 22px;
    }

    .info p {
      font-family: "Poiret One", sans-serif;
      font-size: 21px;
      line-height: 1.45;
      letter-spacing: 0.02em;
      margin: 14px 0;
    }

    .secret {
      margin-top: 28px !important;
      font-style: italic;
      opacity: 0.65;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="startScreen">

      <h1>Выбери свой подарок</h1>

      <div class="subtitle">
        Доверься интуиции
      </div>

      <div class="cards">

        <button class="card" onclick="chooseGift(1)">
          <img src="03968e67-1cba-4f3a-a979-e55ffd8fa4d3.png" alt="Подарок 1">
          <div class="card-title">Выбрать</div>
        </button>

        <button class="card" onclick="chooseGift(2)">
          <img src="23492d5a-0d37-47df-9001-7e77c6026348.png" alt="Подарок 2">
          <div class="card-title">Выбрать</div>
        </button>

        <button class="card" onclick="chooseGift(3)">
          <img src="82d72417-2606-4d25-85c1-1e5b94672d93.png" alt="Подарок 3">
          <div class="card-title">Выбрать</div>
        </button>

      </div>

    </div>

    <div id="result" class="result">

      <h2>Твой выбор сделан</h2>

      <div class="info">

        <p class="date">5 сентября · 19:00</p>

        <p>📍 Санкт-Петербург</p>

        <p>Адрес: здесь будет адрес</p>

        <p>Будь там точно к назначенному времени.</p>

        <p class="secret">
          А что именно тебя ждёт — узнаешь на месте.
        </p>

      </div>

    </div>

  </div>

  <script>

    const tg = window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function chooseGift(number) {

      const cards = document.querySelectorAll(".card");

      cards.forEach((card, index) => {

        if (index === number - 1) {
          card.classList.add("selected");
        } else {
          card.classList.add("hidden");
        }

      });

      setTimeout(function() {

        document.getElementById("startScreen").style.display = "none";

        document.getElementById("result").classList.add("show");

      }, 700);
    }

  </script>

</body>
</html>
