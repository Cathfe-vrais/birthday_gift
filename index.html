<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Твой подарок</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3eee7;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 35px 18px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin: 10px 0 8px;
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.65;
      margin-bottom: 28px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 22px;
      overflow: hidden;
      background: white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.10);
      cursor: pointer;
      transition: all 0.6s ease;
    }

    .card img {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: cover;
    }

    .card-title {
      padding: 15px;
      font-size: 18px;
    }

    .card.hidden {
      opacity: 0;
      transform: scale(0.7);
      max-height: 0;
      margin: 0;
      pointer-events: none;
    }

    .card.selected {
      transform: scale(1.02);
    }

    .result {
      display: none;
    }

    .result.show {
      display: block;
      animation: appear 0.8s ease;
    }

    .result h2 {
      font-size: 28px;
      margin: 15px 0 28px;
    }

    .info {
      background: white;
      border-radius: 22px;
      padding: 28px 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.10);
    }

    .date {
      font-size: 25px;
      font-weight: bold;
      margin: 0 0 22px;
    }

    .info p {
      font-size: 18px;
      line-height: 1.5;
      margin: 14px 0;
    }

    .secret {
      margin-top: 28px !important;
      font-style: italic;
      opacity: 0.65;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="startScreen">

      <h1>Выбери свой подарок 🎁</h1>

      <div class="subtitle">
        Доверься своей интуиции
      </div>

      <div class="cards">

        <button class="card" onclick="chooseGift(1)">
          <img src="IMG_20260816_172836.png" alt="Подарок 1">
          <div class="card-title">Выбрать</div>
        </button>

        <button class="card" onclick="chooseGift(2)">
          <img src="IMG_20260816_172904.png" alt="Подарок 2">
          <div class="card-title">Выбрать</div>
        </button>

        <button class="card" onclick="chooseGift(3)">
          <img src="IMG_20260816_172922.png" alt="Подарок 3">
          <div class="card-title">Выбрать</div>
        </button>

      </div>

    </div>


    <div id="result" class="result">

      <h2>Твой выбор сделан ✨</h2>

      <div class="info">

        <p class="date">5 сентября · 19:00</p>

        <p>📍 Санкт-Петербург</p>

        <p>Адрес: здесь будет адрес</p>

        <p>Будь там точно к назначенному времени.</p>

        <p class="secret">
          А что именно тебя ждёт — узнаешь на месте.
        </p>

      </div>

    </div>

  </div>


  <script>

    const tg = window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function chooseGift(number) {

      const cards = document.querySelectorAll(".card");

      cards.forEach((card, index) => {

        if (index === number - 1) {
          card.classList.add("selected");
        } else {
          card.classList.add("hidden");
        }

      });

      setTimeout(function() {

        document.getElementById("startScreen").style.display = "none";

        document.getElementById("result").classList.add("show");

      }, 700);
    }

  </script>

</body>
</html>
